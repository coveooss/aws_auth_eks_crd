name: Image policy

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] PR content is only read, never run
    branches:
      - master

permissions: {}

concurrency:
  group: image-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify deployed images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: Verify image references
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          allowed='^ghcr\.io/coveooss/aws_auth_eks_crd(:[A-Za-z0-9._-]+)?@sha256:[a-f0-9]{64}$'

          workdir=$(mktemp -d)
          git -C "$workdir" init -q
          git -C "$workdir" fetch -q --no-tags --depth=1 "https://github.com/$REPO" "$BASE_SHA" "$HEAD_SHA"

          render() {
            local dir
            dir=$(mktemp -d)
            git -C "$workdir" archive "$1" kubernetes | tar -x -C "$dir"
            kubectl kustomize "$dir/kubernetes" \
              | sed -nE 's/^[[:space:]-]*image:[[:space:]]*//p' \
              | tr -d "\"' " \
              | sort -u
          }

          base_images=$(render "$BASE_SHA")
          head_images=$(render "$HEAD_SHA")
          if [[ -z "$head_images" ]]; then
            echo "::error::no container image found in the rendered kubernetes/ manifests"
            exit 1
          fi

          status=0
          while IFS= read -r ref; do
            if [[ ! "$ref" =~ $allowed ]]; then
              echo "::error::$ref must be ghcr.io/coveooss/aws_auth_eks_crd pinned by digest"
              status=1
            elif grep -qxF -- "$ref" <<<"$base_images"; then
              echo "unchanged: $ref"
            elif gh attestation verify "oci://$ref" \
                --repo "$REPO" \
                --signer-workflow "$REPO/.github/workflows/docker-image.yml" \
                --source-ref refs/heads/master \
                --deny-self-hosted-runners; then
              echo "verified: $ref"
            else
              echo "::error::$ref has no valid provenance from $REPO docker-image.yml on master"
              status=1
            fi
          done <<<"$head_images"
          exit "$status"
